<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Afterglow</title>
<style>
:root {
  --bg: #1b1b1b; --panel: #232323; --panel2: #2c2c2c; --line: #333; --line2: #3d3d3d;
  --text: #f2f2f2; --muted: #9a9a9a; --faint: #666; --track: #474747;
  --brand: #0d99ff; --brand-text: #fff; --hover: rgba(255,255,255,.06); --danger: #ff5a45;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
body { font: 11px/1.3 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; user-select: none; overflow: hidden; }
button { font: inherit; color: inherit; }
svg { display: block; }

/* top bar */
.bar { height: 48px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 12px 0 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
.brand { font-size: 13px; font-weight: 600; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
.brand i { width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #fff, #9fd3ff 35%, #3a5cff 70%, transparent 72%); box-shadow: 0 0 10px #6fa8ff; }
.spacer { flex: 1; }
.stat { color: var(--muted); font-variant-numeric: tabular-nums; }
.seg { display: flex; height: 26px; padding: 2px; border-radius: 7px; background: var(--panel2); gap: 2px; }
.seg button { flex: 1; border: none; border-radius: 5px; background: transparent; color: var(--muted); font-size: 11px; cursor: pointer; padding: 0 10px; white-space: nowrap; }
.seg button:hover { color: var(--text); }
.seg button.on { background: #3a3a3a; color: var(--text); box-shadow: 0 0 0 1px var(--line2); }
.seg button:focus { outline: none; }
.seg button:focus-visible { box-shadow: 0 0 0 2px var(--brand); }
.mode-seg { height: 30px; }
.mode-seg button { padding: 0 14px; font-size: 12px; }
.mode-seg button.on[data-v="preview"] { background: var(--brand); color: #fff; box-shadow: none; }
.primary { height: 32px; padding: 0 14px; border: none; border-radius: 7px; background: var(--brand); color: var(--brand-text); font-size: 12px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 6px; }
.primary:hover { filter: brightness(1.08); }
.primary:disabled { opacity: .4; cursor: default; filter: none; }
.ghost { height: 26px; padding: 0 9px; border: 1px solid var(--line2); border-radius: 6px; background: transparent; cursor: pointer; color: var(--text); white-space: nowrap; }
.ghost:hover { background: var(--hover); }
.icon-btn { width: 28px; height: 28px; flex: none; border: none; border-radius: 6px; background: transparent; display: grid; place-items: center; cursor: pointer; color: var(--muted); }
.icon-btn:hover { background: var(--hover); color: var(--text); }

main { flex: 1; min-height: 0; display: flex; }

/* side panel */
.side { width: 300px; flex: none; background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--line2) transparent; }
.sec { padding: 6px 16px 10px; border-bottom: 1px solid var(--line); }
.sec-head { display: flex; align-items: center; justify-content: space-between; height: 30px; }
.sec-head .t { font-weight: 600; }
.sec .rows { transition: opacity .15s; }
.sec.off .rows { opacity: .38; }
.row { display: grid; grid-template-columns: 62px 1fr 40px; gap: 8px; align-items: center; height: 26px; }
.row > label { color: var(--muted); white-space: nowrap; }
.row.tools { display: flex; align-items: center; gap: 8px; height: 30px; }
.row.tools .seg { flex: 1; }
.row.hidden { display: none; }
.text-row { padding: 4px 0 6px; display: flex; flex-direction: column; gap: 6px; }
.text-row[hidden] { display: none; }
.text-in { display: block; width: 100%; box-sizing: border-box; min-height: 34px; max-height: 160px; padding: 7px 9px; border: 1px solid var(--line2); border-radius: 6px; background: var(--panel2); color: var(--text); font: 500 15px/1.3 inherit; font-family: inherit; resize: none; overflow-y: auto; }
.font-row { display: flex; align-items: center; gap: 8px; height: 26px; }
.font-name { flex: 1; min-width: 0; color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.font-row .ghost { height: 22px; }
.text-in.sub { min-height: 30px; padding: 6px 9px; font-size: 12px; font-weight: 400; }
.text-in::placeholder { color: var(--faint); }
.text-in:focus { outline: none; border-color: var(--brand); }
.slot { display: flex; align-items: center; gap: 8px; height: 34px; }
.slot .k { width: 46px; color: var(--muted); }
.slot .v { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot .v small { color: var(--muted); margin-left: 4px; }
.slot .v.empty { color: var(--faint); }

input[type="checkbox"].switch { appearance: none; -webkit-appearance: none; width: 26px; height: 16px; border-radius: 8px; background: var(--track); position: relative; cursor: pointer; margin: 0; flex: none; transition: background .15s; }
input[type="checkbox"].switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: #fff; transition: left .15s; }
input[type="checkbox"].switch:checked { background: var(--brand); }
input[type="checkbox"].switch:checked::after { left: 12px; }
input[type="checkbox"].switch:focus { outline: none; }

.slider { position: relative; height: 24px; touch-action: none; --t: 0; --a: 0; --b: 0; }
.slider:focus { outline: none; }
.slider .rail, .slider .fill { position: absolute; top: 50%; height: 2px; margin-top: -1px; border-radius: 1px; }
.slider .rail { left: 5px; right: 5px; background: var(--track); }
.slider .fill { background: var(--brand); left: calc(5px + var(--a) * (100% - 10px)); width: calc((var(--b) - var(--a)) * (100% - 10px)); }
.slider .zero { position: absolute; top: 50%; width: 1px; height: 6px; margin-top: -3px; background: var(--faint); left: calc(5px + var(--z) * (100% - 10px)); display: none; }
.slider.bipolar .zero { display: block; }
.slider .thumb { position: absolute; top: 50%; width: 10px; height: 10px; margin-top: -5px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.3), 0 1px 3px rgba(0,0,0,.35); left: calc(var(--t) * (100% - 10px)); }
.slider:focus-visible .thumb { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--brand); }
.num { width: 40px; height: 22px; padding: 0 5px; border: 1px solid transparent; border-radius: 4px; background: transparent; color: var(--text); font: inherit; font-variant-numeric: tabular-nums; text-align: right; user-select: text; }
.num:hover { border-color: var(--line2); }
.num:focus { outline: none; border-color: var(--brand); }

/* stage */
.center { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.stage { flex: 1; min-height: 0; position: relative; display: grid; place-items: center; padding: 28px; }
.frame { position: relative; box-shadow: 0 0 0 1px #2e2e2e, 0 20px 60px rgba(0,0,0,.5); background: #000; }
.frame canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.design-box { position: absolute; border: 1px dashed rgba(13,153,255,0); cursor: move; touch-action: none; }
.design-box:hover, .design-box.drag { border-color: rgba(13,153,255,.9); }
body.preview .design-box { display: none; }
.badge { position: absolute; top: 10px; left: 10px; height: 20px; padding: 0 7px; border-radius: 4px; background: rgba(0,0,0,.6); color: #fff; font-size: 10px; display: flex; align-items: center; pointer-events: none; backdrop-filter: blur(6px); }
.drop { position: absolute; inset: 0; display: none; place-items: center; background: rgba(13,153,255,.12); border: 2px dashed var(--brand); color: #fff; font-size: 14px; font-weight: 500; z-index: 5; pointer-events: none; }
body.dragging .drop { display: grid; }

/* transport */
.transport { height: 56px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 20px; border-top: 1px solid var(--line); background: var(--panel); }
.time { font-variant-numeric: tabular-nums; color: var(--muted); width: 92px; }
.time b { color: var(--text); font-weight: 500; }
.timeline { flex: 1; position: relative; height: 32px; touch-action: none; cursor: pointer; }
.timeline .track { position: absolute; left: 0; right: 0; top: 13px; height: 6px; border-radius: 3px; background: var(--panel2); }
.timeline .range { position: absolute; top: 13px; height: 6px; background: #3b4a5a; border-radius: 3px; }
.timeline .head { position: absolute; top: 5px; width: 2px; height: 22px; margin-left: -1px; background: #fff; border-radius: 1px; pointer-events: none; }
.timeline .trim { position: absolute; top: 8px; width: 10px; height: 16px; margin-left: -5px; border-radius: 3px; background: var(--brand); cursor: ew-resize; }
.timeline .trim::after { content: ''; position: absolute; left: 4px; top: 4px; width: 2px; height: 8px; background: rgba(255,255,255,.7); border-radius: 1px; }
.dur { color: var(--muted); font-variant-numeric: tabular-nums; width: 60px; text-align: right; }

/* export overlay */
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; place-items: center; z-index: 20; }
.modal.show { display: grid; }
.card { width: 340px; padding: 18px; border-radius: 12px; background: var(--panel); box-shadow: 0 0 0 1px var(--line2), 0 20px 60px rgba(0,0,0,.6); }
.card h3 { margin: 0 0 4px; font-size: 13px; font-weight: 600; }
.card p { margin: 0 0 14px; color: var(--muted); }
.progress { height: 6px; border-radius: 3px; background: var(--panel2); overflow: hidden; margin-bottom: 14px; }
.progress div { height: 100%; width: 0; background: var(--brand); transition: width .1s; }
.card .actions { display: flex; justify-content: flex-end; gap: 8px; }
.toast { position: fixed; left: 50%; bottom: 76px; transform: translate(-50%, 8px); opacity: 0; background: #111; color: #fff; padding: 8px 12px; border-radius: 7px; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 30; box-shadow: 0 0 0 1px var(--line2); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.err { background: #8d2216; }
kbd { font: inherit; padding: 0 4px; border-radius: 3px; background: var(--panel2); color: var(--muted); }
</style>
</head>
<body>
<header class="bar">
  <div class="brand"><i></i>Afterglow</div>
  <div class="seg mode-seg" id="modeSeg" title="P toggles">
    <button data-v="edit" class="on">Edit</button>
    <button data-v="preview">Preview</button>
  </div>
  <span class="stat" id="stat"></span>
  <div class="spacer"></div>
  <span class="stat"><kbd>Space</kbd> play · <kbd>P</kbd> preview · <kbd>⌘V</kbd> paste design</span>
  <button class="primary" id="exportBtn">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 2v7M4 6l3 3 3-3M2.5 11.5h9"/></svg>
    Export MP4
  </button>
</header>
<main>
  <aside class="side" id="side"></aside>
  <section class="center">
    <div class="stage" id="stage">
      <div class="frame" id="frame">
        <canvas id="c"></canvas>
        <div class="design-box" id="designBox" title="Drag to move the design"></div>
        <div class="badge" id="badge">Edit</div>
      </div>
      <div class="drop">Drop a video (background) or image (design)</div>
    </div>
    <div class="transport">
      <button class="icon-btn" id="playBtn" title="Play (Space)"></button>
      <div class="time" id="time"><b>0:00.0</b> / 0:00.0</div>
      <div class="timeline" id="timeline">
        <div class="track"></div>
        <div class="range" id="range"></div>
        <div class="trim" id="trimIn" title="Trim start"></div>
        <div class="trim" id="trimOut" title="Trim end"></div>
        <div class="head" id="head"></div>
      </div>
      <div class="dur" id="dur"></div>
      <button class="icon-btn" id="muteBtn" title="Mute playback"></button>
    </div>
  </section>
</main>

<div class="modal" id="modal">
  <div class="card">
    <h3 id="mTitle">Exporting</h3>
    <p id="mText">Rendering frames…</p>
    <div class="progress"><div id="mBar"></div></div>
    <div class="actions"><button class="ghost" id="mCancel">Cancel</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="fileVideo" accept="video/*,image/*" hidden>
<input type="file" id="fileDesign" accept="image/*" hidden>
<script type="module" src="app.js"></script>
</body>
</html>
